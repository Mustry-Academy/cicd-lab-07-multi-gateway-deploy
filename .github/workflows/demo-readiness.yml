name: Customer demo readiness
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ready:
    runs-on: [self-hosted, cicd-capstone]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check populated public demo
        run: tools/demo/check-runtime.sh progress
