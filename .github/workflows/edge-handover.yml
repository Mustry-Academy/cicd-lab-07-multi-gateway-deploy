# One-off: move the capstone stack to Mustry-Solutions/mustry-cloud-edge.
name: edge-handover
on:
  workflow_dispatch:
    inputs:
      step:
        description: switch or read-log
        required: true
jobs:
  handover:
    runs-on: [self-hosted, cicd-capstone]
    steps:
      - name: Start the switch after this job ends
        if: inputs.step == 'switch'
        env:
          EDGE_TOKEN: ${{ secrets.EDGE_TOKEN }}
          EDGE_RUNNER_TOKEN: ${{ secrets.EDGE_RUNNER_TOKEN }}
        run: |
          cat > /opt/cicd-lab-07/edge-switch.sh <<'SCRIPT'
          #!/bin/sh
          # Runs in a detached docker:cli container on the capstone host, after the job
          # that started it has finished. Moves the capstone stack from
          # /opt/cicd-lab-07/capstone to /opt/edge/capstone.
          set -eu
          exec >> /opt/edge-handover.log 2>&1
          echo "== $(date -Iseconds) handover start"
          sleep 25
          apk add --no-cache git > /dev/null
          old=/opt/cicd-lab-07/capstone
          new=/opt/edge/capstone
          git config --global --add safe.directory /opt/edge
          git -C /opt/edge fetch -q "https://x-access-token:${EDGE_TOKEN}@github.com/Mustry-Solutions/mustry-cloud-edge.git" main
          git -C /opt/edge merge --ff-only FETCH_HEAD
          test -f "$new/docker-compose.yaml"
          cp -a "$old/.env" "$new/.env"
          cp -a "$old/secrets/." "$new/secrets/"
          find "$old/backups" -mindepth 1 -maxdepth 1 ! -name .gitkeep -exec mv {} "$new/backups/" \;
          sed -i -e 's/^RUNNER_GITHUB_PAT=.*/RUNNER_GITHUB_PAT=/' -e '/^RUNNER_TOKEN=/d' "$new/.env"
          printf 'RUNNER_TOKEN=%s\n' "$EDGE_RUNNER_TOKEN" >> "$new/.env"
          docker compose -f "$new/docker-compose.yaml" --project-directory "$new" config -q
          for f in /etc/cron.d/* /var/spool/cron/crontabs/root; do
            if [ ! -f "$f" ] || ! grep -q "$old" "$f"; then continue; fi
            mode=$(stat -c %a "$f"); owner=$(stat -c %u:%g "$f")
            sed -i "s#$old#$new#g" "$f"
            chmod "$mode" "$f"; chown "$owner" "$f"
            echo "cron updated: $f"
          done
          touch /var/spool/cron/crontabs 2>/dev/null || true
          docker rm -f cicd-capstone-runner
          cd "$new"
          docker compose up -d
          for i in $(seq 1 72); do
            s=$(docker inspect -f '{{.State.Health.Status}}' cicd-capstone-gateway 2>/dev/null || echo missing)
            [ "$s" = healthy ] && { echo "gateway healthy after $((i * 5))s"; docker compose ps; echo "== handover done"; exit 0; }
            sleep 5
          done
          echo "gateway NOT healthy, rolling back to $old"
          docker compose logs --tail 40 ignition || true
          docker compose rm -sf
          cd "$old" && docker compose up -d
          echo "== rolled back"
          SCRIPT
          docker run -d --name edge-handover --rm \
            -e EDGE_TOKEN -e EDGE_RUNNER_TOKEN \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /opt:/opt \
            -v /etc/cron.d:/etc/cron.d \
            -v /var/spool/cron:/var/spool/cron \
            -v /usr/libexec/docker/cli-plugins/docker-compose:/root/.docker/cli-plugins/docker-compose:ro \
            docker:cli sh /opt/cicd-lab-07/edge-switch.sh
      - name: Show the switch log
        if: inputs.step == 'read-log'
        run: docker run --rm -v /opt:/opt alpine sh -c 'cat /opt/edge-handover.log; ls -la /opt/edge/capstone'
